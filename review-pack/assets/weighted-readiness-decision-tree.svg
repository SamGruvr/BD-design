<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1260" viewBox="0 0 1040 1260" role="img" aria-labelledby="title desc">
  <title id="title">Weighted Readiness Decision Tree</title>
  <desc id="desc">Decision flow for Step 2 and Step 3 weighted readiness scoring, advisory readiness guidance and recommendation outcomes.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.6; rx: 12; }
      .boxBlue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; rx: 10; }
      .boxGreen { fill: #ecfdf5; stroke: #34d399; stroke-width: 1.5; rx: 10; }
      .boxAmber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; rx: 10; }
      .boxRed { fill: #fef2f2; stroke: #f87171; stroke-width: 1.5; rx: 10; }
      .boxViolet { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 1.5; rx: 10; }
      .label { font: 600 14px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 12px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowHead); }
      .decision { fill: #ffffff; stroke: #64748b; stroke-width: 1.8; }
      .decisionText { font: 600 13px Arial, sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrowHead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="1260"/>
  <text class="title" x="36" y="48">BD Capture: Weighted Readiness Decision Tree</text>
  <text class="subtitle" x="36" y="76">Used by /api/deals/:dealId/reviews/readiness and Step 2/3 review guidance (non-blocking).</text>

  <rect class="box" x="250" y="110" width="540" height="74"/>
  <text class="label" x="276" y="142">1) Start readiness evaluation</text>
  <text class="small" x="276" y="164">Inputs: step, context tables, checklist, stakeholders, competitors</text>

  <rect class="box" x="250" y="220" width="540" height="74"/>
  <text class="label" x="276" y="252">2) Compute base section percentages</text>
  <text class="small" x="276" y="274">percent = completed checks / total checks</text>

  <line class="arrow" x1="520" y1="184" x2="520" y2="220"/>

  <rect class="boxBlue" x="40" y="340" width="230" height="86"/>
  <text class="label" x="58" y="368">Opportunity Profile</text>
  <text class="small" x="58" y="390">Weight: 35</text>
  <text class="small" x="58" y="408">Minimum: 60%</text>

  <rect class="boxBlue" x="290" y="340" width="230" height="86"/>
  <text class="label" x="308" y="368">Schedule Milestones</text>
  <text class="small" x="308" y="390">Weight: 20</text>
  <text class="small" x="308" y="408">Minimum: 66%</text>

  <rect class="boxBlue" x="540" y="340" width="230" height="86"/>
  <text class="label" x="558" y="368">Incumbent Baseline</text>
  <text class="small" x="558" y="390">Weight: 20</text>
  <text class="small" x="558" y="408">Minimum: 50%</text>

  <rect class="boxBlue" x="790" y="340" width="210" height="86"/>
  <text class="label" x="808" y="368">Market Evidence</text>
  <text class="small" x="808" y="390">Weight: 15</text>
  <text class="small" x="808" y="408">Minimum: 50%</text>

  <line class="arrow" x1="520" y1="294" x2="155" y2="340"/>
  <line class="arrow" x1="520" y1="294" x2="405" y2="340"/>
  <line class="arrow" x1="520" y1="294" x2="655" y2="340"/>
  <line class="arrow" x1="520" y1="294" x2="895" y2="340"/>

  <polygon class="decision" points="520,470 640,525 520,580 400,525"/>
  <text class="decisionText" x="472" y="530">Step == 3?</text>
  <line class="arrow" x1="520" y1="426" x2="520" y2="470"/>

  <rect class="boxViolet" x="40" y="620" width="260" height="78"/>
  <text class="label" x="58" y="648">Step 2 reserve section</text>
  <text class="small" x="58" y="670">Weight: 10</text>
  <text class="small" x="58" y="686">No minimum rule</text>
  <line class="arrow" x1="400" y1="525" x2="300" y2="659"/>
  <text class="small" x="345" y="560">No</text>

  <rect class="boxViolet" x="660" y="620" width="320" height="78"/>
  <text class="label" x="678" y="618">Step 3 status update</text>
  <text class="small" x="678" y="640">Weight: 5, minimum: 100%</text>

  <rect class="boxViolet" x="660" y="710" width="320" height="78"/>
  <text class="label" x="678" y="738">Step 3 source links (FPDS)</text>
  <text class="small" x="678" y="760">Weight: 5, minimum: 100%</text>

  <rect class="boxViolet" x="660" y="800" width="320" height="78"/>
  <text class="label" x="678" y="828">Step 3 checklist complete</text>
  <text class="small" x="678" y="850">Weight: 10, minimum: 100%</text>

  <line class="arrow" x1="640" y1="525" x2="660" y2="659"/>
  <text class="small" x="646" y="560">Yes</text>
  <line class="arrow" x1="170" y1="698" x2="520" y2="930"/>
  <line class="arrow" x1="820" y1="878" x2="520" y2="930"/>

  <rect class="box" x="250" y="930" width="540" height="92"/>
  <text class="label" x="276" y="963">3) Compute totals</text>
  <text class="small" x="276" y="985">sectionWeighted = sectionPercent * sectionWeight / 100</text>
  <text class="small" x="276" y="1005">score = sum(sectionWeighted), minimumFailures = sections below minimum</text>

  <polygon class="decision" points="360,1052 480,1106 360,1160 240,1106"/>
  <text class="decisionText" x="306" y="1102">Threshold met?</text>
  <text class="small" x="292" y="1120">Step 2: score &gt;= 70</text>
  <text class="small" x="292" y="1136">Step 3: score &gt;= 80</text>
  <line class="arrow" x1="410" y1="1022" x2="360" y2="1052"/>

  <polygon class="decision" points="690,1052 830,1106 690,1160 550,1106"/>
  <text class="decisionText" x="624" y="1102">Any minimum</text>
  <text class="decisionText" x="646" y="1120">failures?</text>
  <line class="arrow" x1="480" y1="1106" x2="550" y2="1106"/>
  <text class="small" x="502" y="1092">Yes</text>

  <rect class="boxGreen" x="840" y="1068" width="180" height="76"/>
  <text class="label" x="858" y="1098">guidance: on-track</text>
  <text class="small" x="858" y="1120">Threshold met +</text>
  <text class="small" x="858" y="1136">No minimum failures</text>
  <line class="arrow" x1="830" y1="1106" x2="840" y2="1106"/>
  <text class="small" x="808" y="1092">No</text>

  <rect class="boxRed" x="20" y="1068" width="210" height="76"/>
  <text class="label" x="38" y="1098">guidance: needs attention</text>
  <text class="small" x="38" y="1120">Threshold fail or</text>
  <text class="small" x="38" y="1136">minimum section fail</text>
  <line class="arrow" x1="240" y1="1106" x2="230" y2="1106"/>
  <text class="small" x="252" y="1092">No</text>
  <line class="arrow" x1="550" y1="1106" x2="230" y2="1106"/>
  <text class="small" x="402" y="1092">Yes</text>

  <rect class="boxAmber" x="250" y="1168" width="770" height="72"/>
  <text class="label" x="270" y="1196">Recommendation by weighted score</text>
  <text class="small" x="270" y="1216">&gt;=85: go | &gt;=70: conditional_go | &gt;=50: hold_recycle | &lt;50: no_go</text>
  <text class="small" x="270" y="1232">Recommendation and submitAllowed are evaluated separately.</text>
  <line class="arrow" x1="520" y1="1022" x2="600" y2="1168"/>
</svg>
